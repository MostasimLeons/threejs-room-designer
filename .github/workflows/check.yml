# Runs the same checks as `npm run check` (lint, format, types, tests) plus the
# production build, on every push and pull request. A red ✗ on GitHub means one failed.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
